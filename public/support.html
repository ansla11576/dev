<main>
  <div class="chat-container">
    <h2>고객센터 챗봇</h2>

    <div class="chat-box" id="chat-box">
      <div class="chat-message bot">
        안녕하세요! 무엇을 도와드릴까요?<br><br>
        <span class="chat-bubble" onclick="presetQuestion('환불하고 싶어요')">환불 문의</span><br>
        <span class="chat-bubble" onclick="presetQuestion('시험 예약 방법 알려줘')">시험 예약</span><br>
        <span class="chat-bubble" onclick="presetQuestion('할인 쿠폰 있어요?')">할인 문의</span>
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="메시지를 입력하세요..." />
      <button onclick="sendMessage()">전송</button>
    </div>
  </div>
</main>

<script src="support.js"></script>
